---
name: Build ISOs

on:
  schedule:
    - cron: "0 0 1 * *" # 1st of each month
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to build ISO from'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - latest
          - testing

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-iso
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build ISO (${{ matrix.image }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: razorfin
            image-ref: ghcr.io/razorfinos-org/razorfin:${{ inputs.channel || 'stable' }}
          - image: razorfin-nvidia-open
            image-ref: ghcr.io/razorfinos-org/razorfin-nvidia-open:${{ inputs.channel || 'stable' }}

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Capture source image digest
        id: digest
        shell: bash
        run: |
          DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${{ matrix.image-ref }}")
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Pinned to our fork of titanoboa v0.2 — the last release with the
      # hook-post-rootfs interface. Upstream main was rewritten around May 2026
      # and dropped hook support entirely (config moved into the image per the
      # container-native ISO contract). The fork adds one commit pinning just
      # to 1.50.0, since v0.2's Justfile predates the `set lists` feature that
      # just 1.54+ requires for which(). Migrating is tracked in #18; do not
      # bump this pin without reworking iso_files/configure_iso.sh.
      - name: Build ISO
        uses: RazorfinOS-org/titanoboa@4efd95b94d70ddbb978b3f244a0906be97a1f845 # v0.2 + just pin
        id: build
        with:
          image-ref: ${{ matrix.image-ref }}
          iso-dest: ${{ matrix.image }}-live-amd64${{ (inputs.channel || 'stable') != 'stable' && format('-{0}', inputs.channel) || '' }}.iso
          hook-post-rootfs: ${{ github.workspace }}/iso_files/configure_iso.sh

      - name: Generate checksum
        id: checksum
        shell: bash
        run: |
          ISO_UPLOAD_DIR=${{ github.workspace }}/upload
          mkdir -p "${ISO_UPLOAD_DIR}"
          mv "${{ steps.build.outputs.iso-dest }}" "${ISO_UPLOAD_DIR}/"
          cd "${ISO_UPLOAD_DIR}"
          # Relative filename in the .sha256 so downloaders can run `sha256sum -c`
          ISO_NAME="$(basename "${{ steps.build.outputs.iso-dest }}")"
          sha256sum "${ISO_NAME}" > "${ISO_NAME}.sha256"
          echo "iso-upload-dir=${ISO_UPLOAD_DIR}" >> "$GITHUB_OUTPUT"

      - name: Upload ISO and checksum to R2
        shell: bash
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          SOURCE_DIR: ${{ steps.checksum.outputs.iso-upload-dir }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy "${SOURCE_DIR}" R2:${{ secrets.R2_BUCKET_NAME }}

      # Kept out of the R2 upload dir so digest files never ship to the bucket.
      - name: Prepare release metadata
        if: ${{ (inputs.channel || 'stable') == 'stable' }}
        shell: bash
        run: |
          META="${{ github.workspace }}/release-meta"
          mkdir -p "${META}"
          cp "${{ steps.checksum.outputs.iso-upload-dir }}"/*.sha256 "${META}/"
          echo "${{ steps.digest.outputs.digest }}" > "${META}/${{ matrix.image }}.digest"

      - name: Upload release metadata
        if: ${{ (inputs.channel || 'stable') == 'stable' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-meta-${{ matrix.image }}
          path: release-meta/
          if-no-files-found: error
          retention-days: 7

  # Publishes only when every matrix leg succeeded. If one leg fails, fix and
  # use "Re-run failed jobs" — this job then runs automatically.
  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: build-iso
    if: ${{ (inputs.channel || 'stable') == 'stable' }}
    permissions:
      contents: write
    steps:
      - name: Download release metadata
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: release-meta-*
          path: meta
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$(date -u +%Y%m%d)"
          DL="https://download.razorfin.org"

          BASE_SHA=$(awk '{print $1}' meta/razorfin-live-amd64.iso.sha256)
          NV_SHA=$(awk '{print $1}' meta/razorfin-nvidia-open-live-amd64.iso.sha256)
          BASE_DIGEST=$(cat meta/razorfin.digest)
          NV_DIGEST=$(cat meta/razorfin-nvidia-open.digest)

          cat > notes.md <<EOF
          Monthly live ISO build from the \`stable\` channel.

          ## Downloads

          | Variant | ISO | SHA256 |
          |---------|-----|--------|
          | Razorfin (AMD/Intel) | [razorfin-live-amd64.iso](${DL}/razorfin-live-amd64.iso) | \`${BASE_SHA}\` |
          | Razorfin NVIDIA Open | [razorfin-nvidia-open-live-amd64.iso](${DL}/razorfin-nvidia-open-live-amd64.iso) | \`${NV_SHA}\` |

          Checksum files are attached as release assets and also served alongside the ISOs (append \`.sha256\` to the download URL).

          ## Built from

          - \`ghcr.io/razorfinos-org/razorfin:stable@${BASE_DIGEST}\`
          - \`ghcr.io/razorfinos-org/razorfin-nvidia-open:stable@${NV_DIGEST}\`

          > ISO downloads always serve the newest stable build. If a newer release exists, verify your download against that release's checksums instead of these.
          EOF

          # Idempotent: a re-run on the same day replaces the release and tag.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" &>/dev/null; then
            echo "::notice::Release ${TAG} already exists; replacing"
            gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
          fi

          gh release create "${TAG}" meta/*.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Razorfin ${TAG}" \
            --notes-file notes.md \
            --latest
