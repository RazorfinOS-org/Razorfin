---
name: Promote container image

on:
  schedule:
    - cron: '05 10 * * *'  # Daily at 10:05 UTC
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Source tag to promote from (e.g. testing, latest, stable.20260201)'
        required: true
        type: string
      target_tag:
        description: 'Target tag to promote to (e.g. latest, stable)'
        required: true
        type: string

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  promote:
    name: Promote ${{ matrix.suffix || 'base' }}
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        suffix: ["", "-dx", "-nvidia-open", "-dx-nvidia-open"]

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.1'

      # Stable promotion runs BEFORE daily promotion on Tuesdays so that
      # stable gets the week-old latest image, not the one just promoted from testing
      - name: Promote latest to stable (Tuesday only)
        if: github.event_name == 'schedule'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          DAY_OF_WEEK=$(date -u +%u)
          if [[ "${DAY_OF_WEEK}" != "2" ]]; then
            echo "Not Tuesday (day=${DAY_OF_WEEK}), skipping weekly stable promotion"
            exit 0
          fi

          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}${{ matrix.suffix }}"
          DATE_TAG=$(date +%Y%m%d)

          echo "::notice::GHCR inspect ${IMAGE}:latest"
          DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE}:latest" 2>/dev/null || true)
          if [[ -z "${DIGEST}" ]]; then
            echo "Source tag latest not found for ${{ matrix.suffix || 'base' }}, skipping"
            exit 0
          fi

          echo "::notice::GHCR inspect ${IMAGE}:stable"
          STABLE_DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE}:stable" 2>/dev/null || true)
          if [[ "${DIGEST}" == "${STABLE_DIGEST}" ]]; then
            echo "stable already points to ${DIGEST}; skipping copy/date-tag/sign"
            exit 0
          fi

          echo "Promoting ${IMAGE}:latest → stable (${DIGEST})"
          echo "::notice::GHCR copy ${IMAGE}:latest -> ${IMAGE}:stable"
          skopeo copy "docker://${IMAGE}:latest" "docker://${IMAGE}:stable"
          echo "::notice::GHCR copy ${IMAGE}:latest -> ${IMAGE}:stable.${DATE_TAG}"
          skopeo copy "docker://${IMAGE}:latest" "docker://${IMAGE}:stable.${DATE_TAG}"

          echo "::notice::GHCR cosign sign ${IMAGE}@${DIGEST}"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"

      - name: Promote testing to latest
        if: github.event_name == 'schedule'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}${{ matrix.suffix }}"
          DATE_TAG=$(date +%Y%m%d)

          echo "::notice::GHCR inspect ${IMAGE}:testing"
          DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE}:testing" 2>/dev/null || true)
          if [[ -z "${DIGEST}" ]]; then
            echo "Source tag testing not found for ${{ matrix.suffix || 'base' }}, skipping"
            exit 0
          fi

          echo "::notice::GHCR inspect ${IMAGE}:latest"
          LATEST_DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE}:latest" 2>/dev/null || true)
          if [[ "${DIGEST}" == "${LATEST_DIGEST}" ]]; then
            echo "latest already points to ${DIGEST}; skipping copy/date-tag/sign"
            exit 0
          fi

          echo "Promoting ${IMAGE}:testing → latest (${DIGEST})"
          echo "::notice::GHCR copy ${IMAGE}:testing -> ${IMAGE}:latest"
          skopeo copy "docker://${IMAGE}:testing" "docker://${IMAGE}:latest"
          echo "::notice::GHCR copy ${IMAGE}:testing -> ${IMAGE}:latest.${DATE_TAG}"
          skopeo copy "docker://${IMAGE}:testing" "docker://${IMAGE}:latest.${DATE_TAG}"

          echo "::notice::GHCR cosign sign ${IMAGE}@${DIGEST}"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"

      - name: Manual promotion
        if: github.event_name == 'workflow_dispatch'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}${{ matrix.suffix }}"
          SOURCE="${{ inputs.source_tag }}"
          TARGET="${{ inputs.target_tag }}"
          DATE_TAG=$(date +%Y%m%d)

          echo "::notice::GHCR inspect ${IMAGE}:${SOURCE}"
          DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE}:${SOURCE}" 2>/dev/null || true)
          if [[ -z "${DIGEST}" ]]; then
            echo "Source tag ${SOURCE} not found for ${{ matrix.suffix || 'base' }}, skipping"
            exit 0
          fi

          echo "::notice::GHCR inspect ${IMAGE}:${TARGET}"
          TARGET_DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE}:${TARGET}" 2>/dev/null || true)
          if [[ "${DIGEST}" == "${TARGET_DIGEST}" ]]; then
            echo "${TARGET} already points to ${DIGEST}; skipping copy/date-tag/sign"
            exit 0
          fi

          echo "Promoting ${IMAGE}:${SOURCE} → ${TARGET} (${DIGEST})"
          echo "::notice::GHCR copy ${IMAGE}:${SOURCE} -> ${IMAGE}:${TARGET}"
          skopeo copy "docker://${IMAGE}:${SOURCE}" "docker://${IMAGE}:${TARGET}"
          echo "::notice::GHCR copy ${IMAGE}:${SOURCE} -> ${IMAGE}:${TARGET}.${DATE_TAG}"
          skopeo copy "docker://${IMAGE}:${SOURCE}" "docker://${IMAGE}:${TARGET}.${DATE_TAG}"

          echo "::notice::GHCR cosign sign ${IMAGE}@${DIGEST}"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"
